name: Ci

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
  check-format-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          override: true
          toolchain: nightly
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check
  check-format-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 16.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.x'
          run_install: true
      - run: pnpm run check-format
